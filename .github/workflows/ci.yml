name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: zig build test
      - run: zig build
      - run: node tests/fixture_check.js v0.2
      - run: node tests/vm_test.js
      - run: node tests/vm_test.js --vm-file src/vm.min.js
      - run: zig build minify && git diff --exit-code src/vm.min.js
      - run: ./tests/e2e.sh
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build
      - run: cp zig-out/bin/cairn cairn-linux-x86_64
      - name: Collect commits since the previous tag
        id: notes
        run: |
          PREV=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV" ]; then
            NOTES=""
          else
            NOTES=$(git log --oneline "$PREV".."$GITHUB_SHA" | sed 's/^/- /')
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          files: |
            cairn-linux-x86_64
            zig-out/bin/vm_wasm.wasm
